# lychee configuration for the weekly external link check (.github/workflows/links.yml).
#
# Bot-blocked hosts: www.arlingtonva.us (county) and researchgate.net answer HTTP 403 to every
# non-browser client, real and fake paths alike. lychee's `accept` list is global (it cannot be
# scoped to one host), so accepting 403 would also hide real 403s elsewhere. Instead both hosts
# (and their subdomains) are excluded entirely: links to them are NOT checked automatically and
# need a manual look in a real browser (the issue body says so).
# scripts/verify-links.sh keeps the same list (is_bot_blocked) and reports them as warnings.
# Keep the two lists in sync.
#
# The site's own origin (siteUrl in src/content/settings.yaml) is excluded too: every page carries an
# absolute canonical URL, and before DNS cutover that origin is still the old site, where new paths 404.
# Internal links are verified by tests/build.test.ts.
#
# Internal links are covered by tests/build.test.ts, so only https URLs are checked here. The pages use
# root-relative links (/meetings/, /_astro/...), which lychee can only resolve in local files when
# given a root dir: the workflow passes `--root-dir "$GITHUB_WORKSPACE/dist"` (it must be absolute, so
# it is a CLI flag rather than a key here). Resolved, they are file:// URLs, which `scheme` leaves unchecked.

scheme = ["https"]
no_progress = true
verbose = "info"
max_redirects = 10
max_retries = 2
retry_wait_time = 2
timeout = 20
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
accept = ["200..=299", "429"]
include_mail = false

exclude = [
  '^https?://([^/]+\.)?arlingtonva\.us(/|$)',
  '^https?://([^/]+\.)?researchgate\.net(/|$)',
  '^https?://drive\.google\.com(/|$)',
  '^https?://docs\.google\.com(/|$)',
  '^https?://calendar\.google\.com(/|$)',
  '^https?://arlingtonview\.org(/|$)',
  '^mailto:',
]
