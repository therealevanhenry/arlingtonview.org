name: External links

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [links-check]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Broken external links
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: OFFLINE=1 npm run build

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './dist/**/*.html'
          output: lychee/out.md
          fail: false

      # lychee exit codes: 0 clean, 2 link failures, anything else a crash or configuration error.
      # lychee-action always creates the report file, so the exit code is the only reliable signal.
      - name: Classify the result
        id: classify
        run: |
          outcome=$(scripts/lychee-outcome.sh "$LYCHEE_EXIT_CODE")
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}

      - name: Open or update the issue
        if: steps.classify.outputs.outcome != 'crashed'
        run: |
          set -eu
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Broken external links"' --json number,title \
            --jq '[.[] | select(.title == "Broken external links")][0].number // empty')
          today=$(date -u +%Y-%m-%d)
          if [ "$OUTCOME" = "broken" ]; then
            {
              printf 'Links to arlingtonva.us (county) and researchgate.net are not checked automatically: '
              printf 'those sites block non-browser clients with HTTP 403. They need a manual look in a real browser.\n\n'
              cat lychee/out.md
            } > lychee/issue-body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file lychee/issue-body.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Link check run on $today still found broken links; the issue body is updated."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file lychee/issue-body.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Link check run on $today was clean. Close this issue if the problems are resolved."
          fi
        env:
          OUTCOME: ${{ steps.classify.outputs.outcome }}

      - name: Fail the job unless the links were clean
        if: steps.classify.outputs.outcome != 'clean'
        run: |
          if [ "$OUTCOME" = "crashed" ]; then
            echo "::error::lychee crashed or was misconfigured (exit code $LYCHEE_EXIT_CODE), so the links were not checked. No issue was created or edited."
          else
            echo "::error::lychee reported broken links (exit code $LYCHEE_EXIT_CODE); see the issue."
          fi
          exit 1
        env:
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
