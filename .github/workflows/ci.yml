name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  ci:
    # Pinned (not ubuntu-latest): latest moves to Ubuntu 26 on 2026-10-19 and Playwright's --with-deps
    # support for it is unknown. Move this together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:content-edits
      - run: npm run check
      - run: OFFLINE=1 npm run test:build
      - run: scripts/check-reproducible.sh
