name: Browsers

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  browsers:
    # Pinned (not ubuntu-latest): latest moves to Ubuntu 26 on 2026-10-19 and Playwright's --with-deps
    # support for it is unknown. Move this together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium firefox
      - run: npm run test:browsers:all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
